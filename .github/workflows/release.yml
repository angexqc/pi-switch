name: Release

# 打 tag v* 时自动构建三平台并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            args: --linux AppImage deb zip
            assets: |
              release/*.AppImage
              release/*.deb
              release/*.zip
          - name: mac
            os: macos-latest
            args: --mac dmg zip
            assets: |
              release/*.dmg
              release/*.zip
          - name: win
            os: windows-latest
            args: --win nsis portable zip
            assets: |
              release/*.exe
              release/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules (better-sqlite3)
        run: pnpm rebuild

      - name: Build (tsc + vite)
        run: pnpm build

      - name: Package ${{ matrix.name }}
        run: npx electron-builder ${{ matrix.args }}
        env:
          # macOS 未配置签名证书时跳过签名尝试
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.assets }}
          generate_release_notes: true
          draft: false
          prerelease: false
