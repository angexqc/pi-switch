appId: com.piswitch.app
productName: PiSwitch
copyright: Copyright © 2026 PiSwitch
directories:
  output: release
  buildResources: build
files:
  - dist/main/**/*
  - dist/renderer/**/*
  - package.json
extraResources:
  - from: resources
    to: .
    filter:
      - '**/*'
asar: true
asarUnpack:
  - node_modules/better-sqlite3/build/**/*
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
linux:
  icon: build/icon.png
  category: Development
  maintainer: angexqc <501979124@qq.com>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PiSwitch
portable:
  artifactName: PiSwitch-${version}-portable.${ext}
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
npmRebuild: true
